<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Weather App</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Weather</h1>

    <form id="searchForm" class="input-group mb-3">
      <input type="text" id="city" class="form-control" placeholder="Enter city name">
      <button class="btn btn-dark" type="submit">Search</button>
    </form>

    <div id="error" class="alert alert-danger" style="display:none"></div>

    <div id="result" style="display:none">
      <h2 id="cityName"></h2>
      <p class="temp" id="temp"></p>

      <p class="mb-1">Humidity: <span id="humidity"></span>%</p>
      <div class="progress mb-3"><div id="bar" class="progress-bar bg-dark"></div></div>
      <p>Wind: <span id="wind"></span> km/h</p>

      <h3>5-day forecast</h3>
      <div class="row" id="forecast"></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
