<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Age Eligibility Checker</title>
</head>
<body>
    <h2>Voting Age Checker</h2>
    <script>
        let age =  prompt("Enter your age:");

        age = Number(age); 19

        if (age > 0 && Number.isFinite(age) && Number.isInteger(age)) {

            let result = age >= 18
                ? "You are eligible to vote."
                : "You are not eligible to vote.";

            alert(result);

            document.write("<h2>Age: " + age + "</h2>");
            document.write("<h2>" + result + "</h2>");

        } else {
            alert("Please enter a valid age.");

            document.write("<h2>Invalid age entered!</h2>");
        }

    </script>

</body>
</html>
